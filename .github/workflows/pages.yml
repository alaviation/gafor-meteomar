# Genera GAFOR/METEOMAR e pubblica su GitHub Pages.
# Aggiornamento: ogni 6 ore + a mano (Actions → Run workflow) + a ogni push su main.

name: Bollettini → GitHub Pages

on:
  schedule:
    # ~ogni 6 ore (i bollettini AM escono alle sinottiche)
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch: # pulsante "Run workflow" su GitHub
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera HTML dai bollettini live
        run: python3 gafor_meteomar.py --html --html-dir _site --quiet

      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
