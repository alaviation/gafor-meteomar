# Genera GAFOR/METEOMAR e pubblica su GitHub Pages (branch gh-pages).
# Aggiornamento: ogni 6 ore + a mano (Actions → Run workflow) + a ogni push su main.

name: Bollettini → GitHub Pages

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Serve per scrivere sul branch gh-pages
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera HTML dai bollettini live
        run: python3 gafor_meteomar.py --html --html-dir _site --quiet

      - name: Pubblica su branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
