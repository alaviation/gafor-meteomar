# Genera GAFOR/METEOMAR e pubblica su GitHub Pages (branch gh-pages).
#
# Trigger:
#   - schedule: più finestre al giorno (i cron GitHub possono essere in ritardo
#     o saltati sotto carico; per questo non ci si affida a un solo orario)
#   - workflow_dispatch: avvio manuale da Actions
#   - push su main

name: Bollettini → GitHub Pages

on:
  schedule:
    # ~30 min dopo le emissioni tipiche (00/06/12/18 UTC), fuori dal minuto :00
    - cron: "35 0,6,12,18 * * *"
    # rete di sicurezza: ogni 3 ore (i job schedule di GitHub a volte saltano)
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera HTML dai bollettini live
        run: python3 gafor_meteomar.py --html --html-dir _site --quiet

      - name: Pubblica su branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
